{% extends "_base.html" %}

{% block content %}
    <main>
        <h2>{{ post.title }}</h2>
        <p><strong>Publicado:</strong> {{ post.created_at }}</p>
        <p><strong>Autor:</strong> {{ post.author }}</p>
        <p>{{ post.content }}</p>
    </main>
    <a href="{% url 'post_update' post.pk %}">Editar</a>
    <a href="{% url 'post_delete' post.pk %}">Eliminar</a>
{% endblock content %}
