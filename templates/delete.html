{% block content %}
    <main>
        <h2>Eliminar post</h2>
        <p>¿Estás seguro de que quieres eliminar este post "{{ post.title }}"?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit">Eliminar</button>
            <a href="{% url 'post_detail' post.pk %}">Cancelar</a>
        </form>
    </main>
{% endblock content %}
